version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: dbu_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: dbu_security

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dbu_backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    depends_on:
      - mongodb
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/dbu_security
      - JWT_SECRET=change_this_in_production
      - JWT_EXPIRES_IN=7d
      - PORT=5000
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dbu_frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:5000/api

volumes:
  mongo_data:
